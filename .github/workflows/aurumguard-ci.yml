name: AurumGuard CI
on:
  push:
    paths: ["aurumguard/**", ".github/workflows/aurumguard-ci.yml"]
  pull_request:
    paths: ["aurumguard/**", ".github/workflows/aurumguard-ci.yml"]
jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: aurumguard/backend } }
    env:
      APP_ENV: test
      SECRET_KEY: ci-only-secret-key-not-for-production-0123456789
      ANALYSIS_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11", cache: pip, cache-dependency-path: aurumguard/backend/requirements-dev.txt }
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check app tests
      - name: Security static analysis
        run: bandit -q -r app -x app/seed.py -ll
      - name: Migrations apply cleanly
        run: DATABASE_URL=sqlite:///./ci.db alembic upgrade head
      - name: Tests
        run: pytest -q --maxfail=1
  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: aurumguard/frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: aurumguard/frontend/package-lock.json }
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env: { NEXT_PUBLIC_API_URL: http://localhost:8000 }
  security-scans:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret scanning (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Dependency audit (Python)
        run: pip install pip-audit && pip-audit -r aurumguard/backend/requirements.txt --strict || true
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Dependency audit (Node)
        working-directory: aurumguard/frontend
        run: npm audit --audit-level=high || true
